<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Admin | CLB Event</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-bootstrap-4/bootstrap-4.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { font-family: 'Montserrat', sans-serif; background: #f4f7f6; height: 100vh; display: flex; align-items: center; margin: 0; }
        .login-card { border: none; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 400px; padding: 2.5rem; background: white; z-index: 10; }
        .btn-dark { border-radius: 12px; padding: 12px; font-weight: 700; background: #1e3c72; border: none; transition: all 0.3s; }
        .btn-dark:hover { background: #2a5298; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(30, 60, 114, 0.3); }
        
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1e3c72; display: flex; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.5s ease, visibility 0.5s;
        }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-hidden { opacity: 0; visibility: hidden; }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
    </div>

    <div class="container d-flex justify-content-center">
        <div class="login-card">
            <div class="text-center mb-3">
                <img src="logo.png" alt="Logo CLB" style="height: 70px; width: auto; object-fit: contain;">
            </div>
            <h3 class="text-center fw-bold mb-4 text-dark">🔐 Admin Access</h3>
            <p class="text-muted text-center small mb-4">Vui lòng xác thực để quản lý hệ thống</p>
            
            <div class="mb-3">
                <label class="form-label fw-semibold small">Email quản trị</label>
                <input type="email" id="email" class="form-control form-control-lg" value="agileteam782@gmail.com" readonly style="background-color: #f8f9fa; font-size: 0.9rem;">
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold small">Mật khẩu</label>
                <input type="password" id="password" class="form-control form-control-lg" placeholder="Nhập mật khẩu">
            </div>
            
            <button class="btn btn-dark w-100 btn-lg" onclick="handleLogin()">XÁC NHẬN ĐĂNG NHẬP</button>
            
            <div class="text-center mt-4">
                <a href="index.html" class="text-decoration-none small text-muted">← Quay lại Portal</a>
                <a href="createaccount.html" class="text-decoration-none small text-mutd"></a>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener("load", function() {
            setTimeout(() => {
                document.getElementById("loader").classList.add("loader-hidden");
            }, 500);
        });
        function handleLogin() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const loader = document.getElementById("loader");

            if (!password) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Nhắc nè!',
                    text: 'Bạn quên nhập mật khẩu rồi!',
                    confirmButtonColor: '#1e3c72'
                });
                return;
            }

            loader.classList.remove("loader-hidden");

            fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    localStorage.setItem("isAdmin", "true");
                    Swal.fire({
                        title: 'ĐĂNG NHẬP THÀNH CÔNG!',
                        text: 'Chào mừng quay trở lại trang quản trị nhé.',
                        imageUrl: 'logo.png',
                        imageWidth: 80,
                        imageHeight: 80,
                        showConfirmButton: false,
                        timer: 1500,
                        timerProgressBar: true
                    }).then(() => {
                        window.location.href = "admin.html";
                    });
                } else {
                    loader.classList.add("loader-hidden");
                    Swal.fire({
                        icon: 'error',
                        title: 'Úi, mật khẩu sai!',
                        text: 'Kiểm tra lại mật khẩu nhé. Thử lại nào!',
                        confirmButtonColor: '#d33'
                    });
                }
            })
            .catch(() => {
                loader.classList.add("loader-hidden");
                Swal.fire({
                    icon: 'error',
                    title: 'Lỗi server!',
                    text: 'Không thể liên lạc với server Render.',
                    confirmButtonColor: '#d33'
                });
            });
        }
    </script>
</body>
</html>
