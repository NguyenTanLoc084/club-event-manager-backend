<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sự kiện | Admin</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #f0f2f5; }
        .card-custom { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); background: white; }
        .status-badge { font-size: 0.75rem; padding: 5px 10px; border-radius: 20px; }
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1e3c72; display: flex; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s; }
        .loader-hidden { opacity: 0; visibility: hidden; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <script>
        if (localStorage.getItem("isAdmin") !== "true") { window.location.href = "login.html"; }
    </script>

    <div id="loader"><div class="spinner"></div></div>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="admin.html">
                <img src="logo.png" alt="Logo" style="height: 40px; margin-right: 10px;">
                <span>CLB Event Manager</span>
            </a>
            <div class="ms-auto">
                <button class="btn btn-primary btn-sm fw-bold" data-bs-toggle="modal" data-bs-target="#eventModal" onclick="prepareCreate()">➕ Tạo Sự Kiện</button>
                <a href="admin.html" class="btn btn-outline-light btn-sm ms-2">Quay lại Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="card card-custom p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold m-0">🗓 Danh sách quản lý sự kiện</h4>
                <div>
                    <input type="file" id="uploadExcel" hidden accept=".xlsx, .xls" onchange="handleImport(event)">
                    <button class="btn btn-sm btn-outline-success" onclick="document.getElementById('uploadExcel').click()">📤 Import Danh Sách</button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr class="small text-uppercase">
                            <th>Tên sự kiện</th>
                            <th>Thời gian</th>
                            <th>Địa điểm</th>
                            <th>Trạng thái</th>
                            <th class="text-end">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="eventTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="eventModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content" style="border-radius: 20px;">
                <div class="modal-header border-0">
                    <h5 class="fw-bold" id="modalTitle">Thiết lập sự kiện</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editEventId">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Tên sự kiện</label>
                        <input id="eventName" class="form-control" placeholder="Ví dụ: Workshop Agile">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Thời gian</label>
                        <input id="eventTime" type="datetime-local" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Địa điểm</label>
                        <input id="eventLocation" class="form-control" placeholder="Hội trường A">
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button class="btn btn-primary fw-bold" onclick="saveEvent()">Lưu thông tin</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        window.addEventListener("load", () => {
            setTimeout(() => document.getElementById("loader").classList.add("loader-hidden"), 500);
            loadEvents();
        });

        let allEvents = [];

        function loadEvents() {
            fetch('/api/events')
                .then(res => res.json())
                .then(data => {
                    allEvents = data;
                    renderEvents();
                });
        }

        function renderEvents() {
            const tbody = document.getElementById("eventTableBody");
            const now = new Date();

            tbody.innerHTML = allEvents.map(ev => {
                const eventDate = new Date(ev.time);
                const isFinished = now > eventDate;
                
                return `
                    <tr>
                        <td class="fw-bold text-dark">${ev.name}</td>
                        <td class="small">${eventDate.toLocaleString('vi-VN')}</td>
                        <td class="small">${ev.location}</td>
                        <td>
                            <span class="status-badge ${isFinished ? 'bg-secondary text-white' : 'bg-success text-white'}">
                                ${isFinished ? '🔴 Đã kết thúc' : '🟢 Đang diễn ra'}
                            </span>
                        </td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-primary" onclick="exportParticipants('${ev.id}', '${ev.name}')">📊 Xuất khách</button>
                            <button class="btn btn-sm btn-light ms-1" onclick="prepareEdit('${ev.id}')">✏️</button>
                        </td>
                    </tr>
                `;
            }).reverse().join('');
        }
        function exportParticipants(eventId, eventName) {
            fetch('/api/participants')
                .then(res => res.json())
                .then(data => {
                    const filtered = data.filter(p => p.eventId === eventId);
                    if (filtered.length === 0) return alert("Sự kiện này chưa có người đăng ký!");
                    
                    const ws = XLSX.utils.json_to_sheet(filtered.map(p => ({
                        "Họ tên": p.fullname, "Khóa": p.course, "Email": p.email, 
                        "Trạng thái": p.checkedIn ? "Đã tham gia" : "Vắng"
                    })));
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "Danh sách");
                    XLSX.writeFile(wb, `Khach_moi_${eventName}.xlsx`);
                });
        }

        function prepareCreate() {
            document.getElementById("modalTitle").innerText = "Tạo Sự Kiện Mới";
            document.getElementById("editEventId").value = "";
            document.getElementById("eventName").value = "";
            document.getElementById("eventLocation").value = "";
        }

        function prepareEdit(id) {
            const ev = allEvents.find(x => x.id === id);
            document.getElementById("modalTitle").innerText = "Sửa Thông Tin";
            document.getElementById("editEventId").value = ev.id;
            document.getElementById("eventName").value = ev.name;
            document.getElementById("eventLocation").value = ev.location;
            new bootstrap.Modal(document.getElementById('eventModal')).show();
        }

        function saveEvent() {
            const id = document.getElementById("editEventId").value;
            const data = {
                name: document.getElementById("eventName").value,
                time: document.getElementById("eventTime").value,
                location: document.getElementById("eventLocation").value
            };
            
            const url = id ? `/api/event/update/${id}` : '/api/event';
            fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            }).then(() => {
                location.reload();
            });
        }

        function handleImport(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = function(evt) {
                const bstr = evt.target.result;
                const wb = XLSX.read(bstr, {type:'binary'});
                const ws = wb.Sheets[wb.SheetNames[0]];
                const data = XLSX.utils.sheet_to_json(ws);

                alert("Đang xử lý import " + data.length + " sự kiện...");
                Promise.all(data.map(item => 
                    fetch('/api/event', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ name: item.Ten, time: item.ThoiGian, location: item.DiaDiem })
                    })
                )).then(() => location.reload());
            };
            reader.readAsBinaryString(file);
        }
    </script>
</body>
</html>
