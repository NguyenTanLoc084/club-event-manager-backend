<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác nhận có mặt | CLB Event</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-bootstrap-4/bootstrap-4.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { font-family: 'Montserrat', sans-serif; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; margin: 0; }
        .guest-card { background: white; border-radius: 20px; padding: 40px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); width: 100%; max-width: 450px; text-align: center; z-index: 10; }
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1e3c72; display: flex; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-hidden { opacity: 0; visibility: hidden; }

        @media (max-width: 576px) { .guest-card { padding: 25px; margin: 15px; } }
    </style>
</head>
<body>
    <div id="loader"><div class="spinner"></div></div>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="index.html">
                <img src="logo.png" alt="Logo" style="height: 35px; margin-right: 10px;">
                <span class="d-none d-sm-inline">CLB Event Manager</span>
            </a>
            <div class="ms-auto">
                <a href="register.html" class="btn btn-outline-light btn-sm me-2">Đăng ký</a>
                <a href="feedback.html" class="btn btn-outline-info btn-sm">Góp ý</a>
            </div>
        </div>
    </nav>

    <div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="guest-card">
            <h2 class="fw-bold mb-3 text-primary">📍 Check-in nhanh</h2>
            <p class="text-muted mb-4 small">Nhập mã vé (TICKET_...) để xác nhận bạn đã đến hội trường.</p>
            
            <div class="mb-4">
                <input type="text" id="ticketCode" class="form-control form-control-lg text-center fw-bold border-primary" placeholder="NHẬP MÃ VÉ TẠI ĐÂY" style="letter-spacing: 1px; border-width: 2px;">
            </div>
            
            <button class="btn btn-primary w-100 btn-lg fw-bold shadow-sm py-3" onclick="guestCheckIn()">XÁC NHẬN CÓ MẶT</button>
            
            <div class="mt-4 border-top pt-3">
                <a href="register.html" class="text-decoration-none text-muted small">← Quay lại trang Đăng ký</a>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener("load", () => {
            setTimeout(() => document.getElementById("loader").classList.add("loader-hidden"), 500);
        });

        function guestCheckIn() {
            const ticket = document.getElementById("ticketCode").value;
            const loader = document.getElementById("loader");

            if (!ticket) {
                Swal.fire({
                    icon: 'warning',
                    title: 'nhắc nè!',
                    text: 'Bạn vui lòng nhập mã vé trước nhé!',
                    confirmButtonColor: '#1e3c72'
                });
                return;
            }

            loader.classList.remove("loader-hidden");

            fetch('/api/checkin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ticket })
            })
            .then(res => res.json())
            .then(data => {
                loader.classList.add("loader-hidden");
                
                if (data.message.toLowerCase().includes("thành công")) {
                    Swal.fire({
                        title: '🎉 XÁC NHẬN THÀNH CÔNG!',
                        text: `Chào mừng bạn đến với sự kiện của Agile Team.`,
                        imageUrl: 'logo.png',
                        imageWidth: 80,
                        imageHeight: 80,
                        imageAlt: 'Logo CLB',
                        confirmButtonText: 'Tham gia ngay!',
                        confirmButtonColor: '#1e3c72',
                        backdrop: `rgba(30, 60, 114, 0.4)`
                    }).then((result) => {
                        Swal.fire({
                            title: 'Bạn có ý kiến gì không?',
                            text: 'Hãy dành 30 giây góp ý để chúng mình hoàn thiện hơn nhé!',
                            icon: 'question',
                            showCancelButton: true,
                            confirmButtonText: 'Đồng ý',
                            cancelButtonText: 'Để sau',
                            confirmButtonColor: '#28a745'
                        }).then((choice) => {
                            if (choice.isConfirmed) {
                                window.location.href = "feedback.html";
                            } else {
                                document.getElementById("ticketCode").value = "";
                            }
                        });
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Úi, mã vé không đúng!',
                        text: data.message,
                        confirmButtonColor: '#d33'
                    });
                }
            })
            .catch(() => {
                loader.classList.add("loader-hidden");
                Swal.fire('Lỗi kết nối!', 'Không thể liên lạc với server', 'error');
            });
        }
    </script>
</body>
</html>
