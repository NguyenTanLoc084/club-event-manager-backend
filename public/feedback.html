<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góp ý & Phản hồi | CLB Event</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-bootstrap-4/bootstrap-4.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #f4f7f6; margin: 0; }
        .banner-small { 
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); 
            color: white; padding: 40px 0; text-align: center; 
        }
        .feedback-card { 
            border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            background: white; padding: 30px; margin-top: -30px; 
        }
        .btn-success { background-color: #28a745; border: none; padding: 12px; font-weight: 700; border-radius: 12px; transition: all 0.3s; }
        .btn-success:hover { background-color: #218838; transform: translateY(-2px); }
        
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1e3c72; display: flex; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.5s ease, visibility 0.5s;
        }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-hidden { opacity: 0; visibility: hidden; }

        @media (max-width: 576px) {
            .feedback-card { padding: 20px; margin: -30px 15px 0 15px; }
            .banner-small h2 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div id="loader"><div class="spinner"></div></div>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="index.html">
                <img src="logo.png" alt="Logo" style="height: 35px; margin-right: 10px; object-fit: contain;">
                <span class="d-none d-sm-inline">CLB Event Manager</span>
            </a>
            <div class="ms-auto">
                <ul class="navbar-nav flex-row">
                    <li class="nav-item me-3"><a class="nav-link" href="register.html">Đăng ký</a></li>
                    <li class="nav-item"><a class="nav-link active" href="feedback.html">Góp ý</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="banner-small">
        <h2 class="fw-bold">📩 Ý KIẾN CỦA BẠN</h2>
        <p class="text-white-50 px-3">Giúp chúng mình hoàn thiện các sự kiện IT hơn nhé!</p>
    </div>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="feedback-card">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Họ và tên (Không bắt buộc)</label>
                        <input type="text" id="fbName" class="form-control form-control-lg" placeholder="Tên của bạn...">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Nội dung góp ý</label>
                        <textarea id="fbContent" class="form-control form-control-lg" rows="5" placeholder="Bạn cảm thấy thế nào về sự kiện?"></textarea>
                    </div>
                    <button class="btn btn-success w-100 btn-lg shadow" onclick="sendFeedback()">GỬI PHẢN HỒI NGAY</button>
                    <div class="text-center mt-4">
                        <a href="register.html" class="text-decoration-none text-muted small">← Quay lại trang Đăng ký</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-4 text-muted border-top">
        © 2026 CLB Event Manager – Agile Team
    </footer>

    <script>
        window.addEventListener("load", () => {
            setTimeout(() => document.getElementById("loader").classList.add("loader-hidden"), 500);
        });

        function sendFeedback() {
            const name = document.getElementById("fbName").value;
            const content = document.getElementById("fbContent").value;
            const loader = document.getElementById("loader");

            if (!content) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Nhắc nè!',
                    text: 'Bạn đừng để trống nội dung góp ý nhé!',
                    confirmButtonColor: '#1e3c72'
                });
                return;
            }

            loader.classList.remove("loader-hidden");

            fetch('/api/feedback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, content })
            })
            .then(res => res.json())
            .then(data => {
                loader.classList.add("loader-hidden");
                Swal.fire({
                    title: 'GỬI THÀNH CÔNG!',
                    text: 'Cảm ơn bạn! Phản hồi đã được gửi đến ban tổ chức.',
                    imageUrl: 'logo.png',
                    imageWidth: 80,
                    imageHeight: 80,
                    imageAlt: 'Logo CLB',
                    confirmButtonText: 'Quay lại',
                    confirmButtonColor: '#1e3c72'
                }).then(() => {
                    window.location.href = "register.html";
                });
            })
            .catch(() => {
                loader.classList.add("loader-hidden");
                Swal.fire({
                    icon: 'error',
                    title: 'Lỗi kết nối!',
                    text: 'Không thể liên lạc với server Render.',
                    confirmButtonColor: '#d33'
                });
            });
        }
    </script>
</body>
</html>
