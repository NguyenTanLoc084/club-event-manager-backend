<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sự kiện | Admin Dashboard</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #f0f2f5; margin: 0; }
        .table-container { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1e3c72; display: flex; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s; }
        .loader-hidden { opacity: 0; visibility: hidden; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <script>
        if (localStorage.getItem("isAdmin") !== "true") { window.location.href = "login.html"; }
    </script>

    <div id="loader"><div class="spinner"></div></div>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="index.html">
                <img src="logo.png" alt="Logo CLB" style="height: 40px; width: auto; margin-right: 10px; object-fit: contain;" onerror="this.src='https://via.placeholder.com/40'">
                <span class="d-none d-sm-inline">CLB Event Manager</span>
            </a>
            <div class="ms-auto d-flex align-items-center">
                <button class="btn btn-success btn-sm me-2 fw-bold" onclick="exportToExcel()">📊 Xuất Excel</button>
                <a href="create-event.html" class="btn btn-outline-info btn-sm me-2">Tạo Sự Kiện</a>
                <button class="btn btn-danger btn-sm fw-bold" onclick="logout()">Đăng xuất</button>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="table-container">
            <h4 class="fw-bold mb-4 text-dark">👥 Danh sách tham gia</h4>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Họ và tên</th>
                            <th>Khóa</th>
                            <th>Email</th>
                            <th>Trạng thái</th>
                            <th>Ngày đăng ký</th>
                        </tr>
                    </thead>
                    <tbody id="participantList">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        window.addEventListener("load", () => {
            setTimeout(() => document.getElementById("loader").classList.add("loader-hidden"), 500);
        });

        function logout() {
            localStorage.removeItem("isAdmin");
            window.location.href = "login.html";
        }

        function exportToExcel() {
            fetch('/api/participants')
                .then(res => res.json())
                .then(data => {
                    if (data.length === 0) {
                        alert("Chưa có dữ liệu để xuất file!");
                        return;
                    }
                    const worksheetData = data.map(p => ({
                        "Họ và tên": p.fullname,
                        "Giới tính": p.gender,
                        "Khóa": p.course,
                        "Email": p.email,
                        "Mã vé": p.ticket,
                        "Trạng thái": p.checkedIn ? "Đã Check-in" : "Chờ tham gia",
                        "Ngày đăng ký": new Date(p.registeredAt).toLocaleString('vi-VN')
                    }));
                    const worksheet = XLSX.utils.json_to_sheet(worksheetData);
                    const workbook = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(workbook, worksheet, "Danh sách tham gia");
                    const fileName = `Danh_sach_tham_gia_${new Date().toLocaleDateString('vi-VN').replace(/\//g, '-')}.xlsx`;
                    XLSX.writeFile(workbook, fileName);
                });
        }
    </script>
</body>
</html>
